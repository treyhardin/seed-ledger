      THESIS: A season is a measured drawing. Seed Ledger is a landscape architect's working

      OWN-WORLD: Cool drafting-vellum ground, one graphite ink, faint non-repro-blue construction
        grid, 0px corners, hairline rules, dimension/leader/datum linework, a title block + legend;

      STORY: A gardener reads the year as a dimensioned timeline, sees what to sow/harvest next, and
        edits a seed's spec like a schedule line.
      FIRST VIEWPORT: Top bar (logo left, settings icon right); main = The Almanac as a dimensioned year-line — month
        tick-stations, two blue frost datum lines, red today station, each seed a measured
        sow[square]->run->harvest[diamond]; a title block anchors the sheet.
